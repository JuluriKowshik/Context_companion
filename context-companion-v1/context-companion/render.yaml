services:
  - type: web
    name: context-companion
    env: python
    plan: free
    rootDir: backend
    buildCommand: "python -m pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: LLM_PROVIDER
        value: groq
      - key: LEXICAL_DICTIONARY_BUILD_ON_STARTUP
        value: "false"
